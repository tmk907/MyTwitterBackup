# Builds the WinUI 3 app as a signed sideload MSIX (x64 + ARM64) and publishes it as a GitHub release.
#
# Triggers:
#   - pushing a tag v<major>.<minor>.<build>, e.g. v1.6.0
#   - running the workflow manually with an optional version x.y.z (default 1.0.<run number>)
# The version comes from the tag (or the input) and is written to Package.appxmanifest as x.y.z.0.
# The release is published under the tag v<x.y.z>.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   BASE64_ENCODED_PFX  base64 of the code-signing .pfx whose subject is CN=DryForest
#   PFX_PASSWORD        password of that .pfx (leave unset if the .pfx has no password)

name: Build WinUI sideload app

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (x.y.z)'
        required: false
        default: ''

permissions:
  contents: write

env:
  Manifest_Path: MyTwitterBackup.Desktop/Package.appxmanifest

jobs:

  version:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}  # x.y.z: file names and release tag
      package: ${{ steps.version.outputs.package }}  # x.y.z.0: manifest Identity Version

    steps:
    - name: Compute version
      id: version
      shell: pwsh
      run: |
        $version = '${{ github.event.inputs.version }}'
        if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
        if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.${{ github.run_number }}" }
        $parts = @($version.Split('.') | ForEach-Object { [int]$_ })
        while ($parts.Count -lt 3) { $parts += 0 }
        if ($parts.Count -gt 3) { throw "Version $version must be x.y.z (MSIX reserves the fourth number)." }
        $version = $parts -join '.'
        "version=$version" >> $env:GITHUB_OUTPUT
        "package=$version.0" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $version, package version: $version.0"

  build:
    needs: version
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    env:
      Project_Path: MyTwitterBackup.Desktop/MyTwitterBackup.Desktop.csproj
      Package_Dir: ${{ github.workspace }}\winui-packages\
      App_Version: ${{ needs.version.outputs.version }}
      # Package identity of the release build. The publisher must match the subject of the signing certificate.
      MsixPackageId: DryForest.MyTwitterBackup
      MsixPublisherId: CN=DryForest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set version and identity in manifest
      env:
        Package_Version: ${{ needs.version.outputs.package }}
      run: |
        $path = (Resolve-Path $env:Manifest_Path).Path
        [xml]$manifest = Get-Content $path
        $manifest.Package.Identity.Version = $env:Package_Version
        $manifest.Package.Identity.Name = $env:MsixPackageId
        $manifest.Package.Identity.Publisher = $env:MsixPublisherId
        $manifest.Save($path)

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Test
      run: dotnet test MyTwitterBackup.Tests\MyTwitterBackup.Tests.csproj -c Release

    - name: Decode signing certificate
      env:
        PFX_BASE64: ${{ secrets.BASE64_ENCODED_PFX }}
      run: |
        if (-not $env:PFX_BASE64) { throw "Repository secret BASE64_ENCODED_PFX is not set." }
        $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
        [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
        echo "Pfx_Path=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # Self-contained .NET and Windows App SDK: users need no runtime installed besides the MSIX itself.
    # MSBuild reads PackageCertificatePassword from the environment, which keeps it off the command line.
    - name: Build and package MSIX
      env:
        PackageCertificatePassword: ${{ secrets.PFX_PASSWORD }}
      run: >-
        msbuild $env:Project_Path /restore /v:minimal
        /p:Configuration=Release
        /p:Platform=${{ matrix.platform }}
        /p:RuntimeIdentifier=${{ matrix.rid }}
        /p:SelfContained=true
        /p:WindowsAppSDKSelfContained=true
        /p:GenerateAppxPackageOnBuild=true
        /p:UapAppxPackageBuildMode=SideloadOnly
        /p:AppxBundle=Never
        /p:AppxPackageDir="$env:Package_Dir"
        /p:AppxPackageSigningEnabled=true
        /p:PackageCertificateKeyFile="$env:Pfx_Path"
        /p:AppxPackageSigningTimestampServerUrl=http://timestamp.digicert.com
        /p:AppxPackageSigningTimestampDigestAlgorithm=SHA256

    - name: Remove signing certificate
      if: always()
      run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'signing.pfx')

    - name: Collect package
      run: |
        New-Item -ItemType Directory -Force out | Out-Null
        $msix = @(Get-ChildItem $env:Package_Dir -Recurse -Filter *.msix)
        if ($msix.Count -ne 1) { throw "Expected one .msix, found $($msix.Count)." }
        $arch = '${{ matrix.platform }}'.ToLowerInvariant()
        Copy-Item $msix[0].FullName "out/MyTwitterBackup-WinUI-$env:App_Version-$arch.msix"
        # The public certificate is the same for every architecture, so publish it once.
        if ($arch -eq 'x64') {
          Get-ChildItem $env:Package_Dir -Recurse -Filter *.cer | Select-Object -First 1 |
            Copy-Item -Destination out/MyTwitterBackup.cer
        }
        Get-ChildItem out

    - name: Upload package
      uses: actions/upload-artifact@v6
      with:
        name: winui-${{ matrix.platform }}
        path: out/*
        if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: windows-latest

    env:
      App_Version: ${{ needs.version.outputs.version }}

    steps:
    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        path: release
        merge-multiple: true

    - name: Create or update the GitHub release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ env.App_Version }}
        name: MyTwitterBackup ${{ env.App_Version }}
        commit: ${{ github.sha }}
        artifacts: release/*
        # GitHub appends the generated release notes after this body.
        body: |
          ## Install

          1. Download `MyTwitterBackup.cer` and the `.msix` for your PC: `x64` for most PCs, `arm64` for Windows on ARM.
          2. Trust the certificate once (needs admin): open the `.cer`, choose **Install Certificate** > **Local Machine** > **Place all certificates in the following store** > **Trusted People**.
             Or run in an elevated PowerShell: `Import-Certificate -FilePath MyTwitterBackup.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople`
          3. Open the `.msix` and click **Install**. To update later, install the newer `.msix` the same way.
        generateReleaseNotes: true
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
